# Dependabot keeps npm and the action SHAs. Renovate (renovate.json5) keeps go.mod, whole,
# Dockerfile.ci's base images, the runner image and the tool versions CI installs, so that each
# pair that must move together has one owner: the go directive with the golang image, CI's Node
# with the node image. Each pin has one owner.

version: 2
updates:
  # Node dependencies.
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      client-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions. Pins are SHAs with version comments; Dependabot
  # rewrites both. Majors stay outside the group so they arrive singly.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
