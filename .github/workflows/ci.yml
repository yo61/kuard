name: ci

# Validates pull requests. build-kuard.yml only runs on push to main, so before this existed a PR
# that broke the React build or the Go compile looked clean right up until it landed and took the
# GHCR image build with it -- which is exactly how the client_golang 1.x bump (#5) slipped through
# review: it removed prometheus.Handler(), and nothing compiled the code until it was on main.
#
# This never pushes to GHCR; publishing stays in build-kuard.yml. Hence contents:read only.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch: {}

permissions:
  contents: read

# A new push to the PR makes the running build irrelevant -- don't burn a runner finishing it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      # pkg/sitedata/bindata.go is generated and gitignored, so `go test ./...` does not compile on
      # a clean checkout until this has run. Same community fork Dockerfile.ci uses, since the
      # original jteeuwen/go-bindata was deleted from GitHub.
      - name: Generate embedded assets
        run: |
          set -euo pipefail
          go install github.com/go-bindata/go-bindata/go-bindata@latest
          go generate ./cmd/... ./pkg/...

      # Scoped to tracked files rather than ./... : go-bindata's output is not gofmt-clean, and
      # it is gitignored, so `git ls-files` excludes it without needing a skip list.
      - name: gofmt
        run: |
          set -euo pipefail
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  client:
    name: client tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24            # matches the node:24-alpine stage in Dockerfile.ci

      # `npm ci` also fails when package.json and package-lock.json disagree, which the
      # `npm install` in Dockerfile.ci would silently paper over -- the usual damage from
      # hand-resolving a Dependabot lockfile conflict.
      - name: npm ci
        run: |
          set -euo pipefail
          cd client
          npm ci --loglevel=error

      # `npm test` builds the production bundle first and asserts against the emitted output, not
      # the source. That is the only way to catch a bundle that compiles but fails to mount.
      - name: npm test
        run: |
          set -euo pipefail
          cd client
          npm test

  # Builds the same image build-kuard.yml publishes, with push disabled: webpack bundle, go-bindata
  # codegen and the Go compile all run exactly as they do for a release.
  image:
    name: image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      # One arch and one FAKEVER is enough: the release matrix varies only the target platform and
      # a version string baked into the UI, neither of which can break a build that amd64/blue passes.
      # cache-from without cache-to on purpose -- Actions cache is a repo-wide 10GB LRU, so writing
      # a cache entry per PR would evict the entries the release build depends on.
      - name: Build (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile.ci
          platforms: linux/amd64
          push: false
          build-args: |
            FAKEVER=blue
          cache-from: type=gha
