name: ci

# Validates pull requests. build-kuard.yml only runs on push to main, so before this existed a PR
# that broke the React build or the Go compile looked clean right up until it landed and took the
# GHCR image build with it -- which is exactly how the client_golang 1.x bump (#5) slipped through
# review: it removed prometheus.Handler(), and nothing compiled the code until it was on main.
#
# This never pushes to GHCR; publishing stays in build-kuard.yml. Hence contents:read only.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch: {}

permissions:
  contents: read

# A new push to the PR makes the running build irrelevant -- don't burn a runner finishing it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dockerfile.ci installs with `npm install`, which silently rewrites a lockfile that disagrees
  # with package.json. `npm ci` fails instead, so this is the job that catches a lockfile which was
  # hand-edited or regenerated against the wrong base -- the usual damage from resolving a
  # Dependabot conflict by hand.
  client-lockfile:
    name: client lockfile is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 20            # matches the node:20-alpine stage in Dockerfile.ci

      - name: npm ci
        run: |
          set -euo pipefail
          cd client
          npm ci --loglevel=error

  # Builds the same image build-kuard.yml publishes, with push disabled: webpack bundle, go-bindata
  # codegen and the Go compile all run exactly as they do for a release.
  image:
    name: image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      # One arch and one FAKEVER is enough: the release matrix varies only the target platform and
      # a version string baked into the UI, neither of which can break a build that amd64/blue passes.
      # cache-from without cache-to on purpose -- Actions cache is a repo-wide 10GB LRU, so writing
      # a cache entry per PR would evict the entries the release build depends on.
      - name: Build (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile.ci
          platforms: linux/amd64
          push: false
          build-args: |
            FAKEVER=blue
          cache-from: type=gha
