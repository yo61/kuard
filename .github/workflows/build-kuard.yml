name: build-kuard

# Builds the kuard demo app (for "Kubernetes: Up and Running") and pushes it to GHCR, since the
# book's gcr.io/kuar-demo images died with Google Container Registry's shutdown.
# Produces ghcr.io/yo61/kuard:{blue,green,purple} — the three "fake versions" the book uses for
# rollout demos. Build details are in Dockerfile.ci (works around the rotted upstream build).

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch: {}          # run on demand from the Actions tab

permissions:
  contents: read
  packages: write                # push to ghcr.io/yo61/*

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fakever: [blue, green, purple]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}     # built-in token; no PAT needed

      - name: Build & push (${{ matrix.fakever }})
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile.ci
          platforms: linux/amd64,linux/arm64,linux/arm/v7   # cloud/x86, 64-bit ARM (Graviton/Pi 4-5), 32-bit ARM (Pi 2-3)
          push: true
          build-args: |
            FAKEVER=${{ matrix.fakever }}
          tags: ghcr.io/yo61/kuard:${{ matrix.fakever }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
