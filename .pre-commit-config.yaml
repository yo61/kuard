# Read by both prek and pre-commit. prek runs pre-commit-hooks through its Rust fast path.
# Renovate's pre-commit manager owns the rev; the local hooks run the tools mise.toml pins.

# Vendored Bootstrap assets, kept byte-for-byte as upstream ships them.
exclude: ^sitedata/static/(fonts/|.*\.min\.)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types: [go]
      - id: jactionlint
        name: jactionlint
        entry: jactionlint
        language: system
        files: ^\.github/(workflows/.*|dependabot)\.ya?ml$
      - id: zizmor
        name: zizmor
        entry: zizmor .github/workflows/
        language: system
        files: ^\.github/workflows/
        pass_filenames: false
