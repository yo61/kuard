# Read by both prek and pre-commit. prek runs pre-commit-hooks through its Rust fast path.
# Renovate's pre-commit manager owns the rev; the local hooks run the tools mise.toml pins.

# Vendored Bootstrap assets, kept byte-for-byte as upstream ships them.
exclude: ^sitedata/static/(fonts/|.*\.min\.)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types: [go]
      - id: jactionlint
        name: jactionlint
        entry: jactionlint
        language: system
        files: ^\.github/(workflows/.*|dependabot)\.ya?ml$
      - id: node-pins
        name: node pins agree
        entry: scripts/check-node-pins.sh
        language: system
        files: ^(Dockerfile\.ci|\.github/workflows/ci\.yaml|scripts/check-node-pins\.sh)$
        pass_filenames: false
      - id: node-pins-test
        name: node pins check tests
        entry: scripts/check-node-pins_test.sh
        language: system
        files: ^scripts/check-node-pins(_test)?\.sh$
        pass_filenames: false
