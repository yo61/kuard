#:schema https://www.schemastore.org/prek.json
# Builtin hooks ship with prek and local hooks run tools pinned in mise.toml, so this file pins
# no versions itself and Renovate's mise manager stays their only owner.

# Vendored Bootstrap assets, kept byte-for-byte as upstream ships them.
exclude = "^sitedata/static/(fonts/|.*\\.min\\.)"

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-yaml" },
    { id = "check-merge-conflict" },
    { id = "check-added-large-files" },
]

[[repos]]
repo = "local"
hooks = [
    { id = "gofmt", name = "gofmt", entry = "gofmt -w", language = "system", types = ["go"] },
    { id = "actionlint", name = "actionlint", entry = "actionlint", language = "system", files = "^\\.github/workflows/.*\\.ya?ml$" },
    { id = "zizmor", name = "zizmor", entry = "zizmor .github/workflows/", language = "system", files = "^\\.github/workflows/", pass_filenames = false },
]
